debug: false
logging:
  # pluginActivity: false hides routine AuctionHousAqua INFO messages in console. Errors are still printed.
  pluginActivity: false
  # debug: true enables detailed diagnostic messages ("Start loading database...", per-sync logs etc).
  # WARNING: keep false on production! Together with a low syncIntervalSeconds it produced 110k+ log lines per day.
  debug: false
auction:
  maxAuctions:
    player: 5
    overall: 150
    opIgnore: false
  undoTime: 20s
  removeTime: 1m
  maxLength: 7d
  standardLength: 30d
  opCanCheat: true
  timeFormat: 'dd/MM/yy HH:mm'
  punish: 20
  itemBoxLength: 2
  comission: 3
  language: ru
  confirmID: false
  notifyTime: [30m,5m,2m,1m]
  # Use modern material names here on 1.21.8. Legacy numeric ids are ignored by the parser.
  blacklist: [BEDROCK, END_PORTAL_FRAME, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW, LIGHT]
  database:
    type: mysql
    host: localhost
    port: 3306
    user: auctionhouse
    pass: 'change-me'
    name: auctionhouse
    # Optional full JDBC override. Leave empty to use host/port/user/pass/name above.
    # Example:
    # jdbcUrl: 'jdbc:mysql://127.0.0.1:3306/auctionhouse?useSSL=false'
    jdbcUrl: ''
    # Extra JDBC parameters appended automatically to the generated URL.
    # Useful on shared hosting for settings like sslMode=REQUIRED or allowMultiQueries=true
    connectionParameters: ''
    # Optional extra schema names to try before giving up.
    # Useful on shared hosting where the real DB is prefixed, for example bd52856_auctionhouse.
    nameCandidates: []
    # When true, the plugin also auto-tries <accountPrefix>_<name>, derived from the DB user before the first underscore.
    allowAutoPrefixedNames: true
    autoCreateDatabase: true
    connectTimeoutMs: 10000
    socketTimeoutMs: 30000
    # Full-MySQL polling fallback. Recommended values:
    #   0          - polling disabled (use this when redis.enabled is true and Redis is reachable)
    #   30-120     - fallback for single servers or when Redis is disabled/unavailable.
    # Values below 30 are automatically raised to 30: a full table reload every few seconds
    # caused tick freezes and 110k+ lines of debug spam per day. Full reloads now run on an
    # async thread and are applied on the main thread, but they still cost MySQL load.
    # Redis events, when enabled, sync servers instantly without any full reloads.
    syncIntervalSeconds: 0

redis:
  # Redis pub/sub gives instant cross-server sync without full MySQL reloads.
  # Set to false only for a single standalone server (then consider syncIntervalSeconds: 30-120).
  enabled: true
  channel:
    prefix: "auctionhouse:"
    main: "auctionhouse:messaging"
    inventory: "auctionhouse:inventories"
    transaction: "auctionhouse:transactions"
  # SECURITY: never commit real credentials to a repository. If a real password/host ever
  # was committed, rotate it immediately (change the Redis password and the requirepass config).
  host: "127.0.0.1"
  port: 6379
  password: "change-me"
  database: 0
  # Regular command timeout. Subscriber uses an infinite read timeout, so idle Redis does not reconnect every few seconds.
  timeoutMs: 2000
  lockTtlMs: 15000
  poolConfig:
    maxTotal: 128
    maxIdle: 128
    minIdle: 16
